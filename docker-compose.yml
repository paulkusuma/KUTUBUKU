version: "3.8"

services:
    app:
        build: .
        container_name: kutubuku_app
        volumes:
            - .:/var/www
        depends_on:
            - mysql

    nginx:
        image: nginx:latest
        container_name: kutubuku_nginx
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./docker/nginx:/etc/nginx/conf.d
        depends_on:
            - app

    mysql:
        image: mysql:8.0
        container_name: kutubuku_mysql
        restart: always
        environment:
            MYSQL_DATABASE: kutubuku_db
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: laravel
            MYSQL_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - dbdata:/var/lib/mysql
            - ./docker/mysql:/docker-entrypoint-initdb.d

    node:
        image: node:18
        container_name: kutubuku_node
        working_dir: /var/www
        volumes:
            - .:/var/www
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev"

volumes:
    dbdata:
